<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Word Tree - Messages</title>

    <link
        rel="stylesheet"
        href="inbox.css"
    >
</head>


<body>

    <main class="messages-page">


        <!-- =====================================
             LEFT SIDE - USERS
             ===================================== -->

        <aside class="people-panel">


            <!-- HEADER -->

            <header class="people-header">

                <button
                    class="back-button"
                    id="backButton"
                    type="button"
                >
                    ←
                </button>


                <div>

                    <h1>
                        PALS
                    </h1>

                    <p>
                        FIND SOMEONE TO TALK TO
                    </p>

                </div>

            </header>


            <!-- SEARCH -->

            <div class="people-search">

                <input
                    type="text"
                    id="searchUsers"
                    placeholder="SEARCH USERS..."
                    autocomplete="off"
                >

            </div>


            <!-- USERS FROM DATABASE -->

            <section
                class="people-list"
                id="peopleList"
            >

                <div class="empty-users">
                    LOADING USERS...
                </div>

            </section>

        </aside>



        <!-- =====================================
             RIGHT SIDE - CHAT
             ===================================== -->

        <section class="chat-panel">


            <!-- NO USER SELECTED -->

            <div
                class="no-chat-selected"
                id="noChatSelected"
            >

                <div class="no-chat-icon">
                    💬
                </div>

                <h2>
                    SELECT SOMEONE
                </h2>

                <p>
                    Choose a person from the left to start chatting.
                </p>

            </div>



            <!-- ACTUAL CHAT -->

            <div
                class="active-chat"
                id="activeChat"
                hidden
            >


                <!-- CHAT HEADER -->

                <header class="chat-header">

                    <div class="chat-user">

                        


                        <div>

                            <h2 id="chatUserName">
                                USER
                            </h2>

                            <p id="chatUserStatus">
                                CHAT
                            </p>

                        </div>

                    </div>

                </header>


                <!-- MESSAGES -->

                <section
                    class="chat-messages"
                    id="chatMessages"
                >

                    <div class="empty-chat">

                        <div class="empty-chat-icon">
                            💬
                        </div>

                        <h2>
                            START YOUR CONVERSATION
                        </h2>

                    </div>

                </section>


                <!-- MESSAGE INPUT -->

                <footer class="chat-input-area">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="TYPE YOUR MESSAGE..."
                        autocomplete="off"
                    >


                    <button
                        id="sendMessage"
                        type="button"
                    >
                        SEND
                    </button>

                </footer>

            </div>

        </section>

    </main>



    <!-- =====================================
         REUSED HOMEPAGE WORD POPUP
         ===================================== -->

    <div
        class="popup-overlay"
        id="wordPopup"
    >
        <div class="word-popup">

            <button
                class="word-popup-close"
                id="closeWordPopup"
                type="button"
                aria-label="Close word popup"
            >
                ×
            </button>

            <div
                class="popup-native-language"
                id="popupNativeLanguage"
            ></div>

            <h2 id="popupWord">
                WORD
            </h2>

            <div id="translationResult"></div>

        </div>
    </div>


    <!-- Minimal popup shell styling.
         popup.js supplies its translation-list styling. -->
    <style>
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
        }

        .popup-overlay.active {
            display: flex;
        }

        .word-popup {
            position: relative;
            box-sizing: border-box;
            width: min(520px, 94vw);
            max-height: 85vh;
            overflow-y: auto;
            padding: 26px;
            border: 4px solid #111;
            background: #e8e2ca;
        }

        .word-popup-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border: 3px solid #111;
            background: #c40072;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        #popupWord {
            margin: 8px 50px 18px 0;
            font-size: 32px;
        }

        #popupNativeLanguage {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .message-words {
            margin: 0 0 4px;
        }

        .chat-word {
            display: inline;
            padding: 0;
            margin: 0;
            border: none;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .chat-word:hover {
            text-decoration: underline;
            font-weight: bold;
        }
    </style>


    <!-- SOCKET.IO -->

    <script
        src="https://cdn.socket.io/4.8.1/socket.io.min.js"
    ></script>

    <script src="inbox.js"></script>

    <!-- Reuse the exact homepage word popup logic -->
    <script src="../../homepage/js/popup.js"></script>

</body>

</html>
