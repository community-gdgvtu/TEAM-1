<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Word Tree - Messages</title>

    <link
        rel="stylesheet"
        href="inbox.css"
    >
</head>


<body>

    <main class="messages-page">


        <!-- =====================================
             LEFT SIDE - USERS
             ===================================== -->

        <aside class="people-panel">


            <!-- HEADER -->

            <header class="people-header">

                <button
                    class="back-button"
                    id="backButton"
                    type="button"
                >
                    ←
                </button>


                <div>

                    <h1>
                        PALS
                    </h1>

                    <p>
                        FIND SOMEONE TO TALK TO
                    </p>

                </div>

            </header>


            <!-- SEARCH -->

            <div class="people-search">

                <input
                    type="text"
                    id="searchUsers"
                    placeholder="SEARCH USERS..."
                    autocomplete="off"
                >

            </div>


            <!-- USERS FROM DATABASE -->

            <section
                class="people-list"
                id="peopleList"
            >

                <div class="empty-users">
                    LOADING USERS...
                </div>

            </section>

        </aside>



        <!-- =====================================
             RIGHT SIDE - CHAT
             ===================================== -->

        <section class="chat-panel">


            <!-- NO USER SELECTED -->

            <div
                class="no-chat-selected"
                id="noChatSelected"
            >

                <div class="no-chat-icon">
                    💬
                </div>

                <h2>
                    SELECT SOMEONE
                </h2>

                <p>
                    Choose a person from the left to start chatting.
                </p>

            </div>



            <!-- ACTUAL CHAT -->

            <div
                class="active-chat"
                id="activeChat"
                hidden
            >


                <!-- CHAT HEADER -->

                <header class="chat-header">

                    <div class="chat-user">

                        


                        <div>

                            <h2 id="chatUserName">
                                USER
                            </h2>

                            <p id="chatUserStatus">
                                CHAT
                            </p>

                        </div>

                    </div>

                </header>


                <!-- MESSAGES -->

                <section
                    class="chat-messages"
                    id="chatMessages"
                >

                    <div class="empty-chat">

                        <div class="empty-chat-icon">
                            💬
                        </div>

                        <h2>
                            START YOUR CONVERSATION
                        </h2>

                    </div>

                </section>


                <!-- MESSAGE INPUT -->

                <footer class="chat-input-area">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="TYPE YOUR MESSAGE..."
                        autocomplete="off"
                    >


                    <button
                        id="sendMessage"
                        type="button"
                    >
                        SEND
                    </button>

                </footer>

            </div>

        </section>

    </main>


    <!-- SOCKET.IO -->

    <script
        src="https://cdn.socket.io/4.8.1/socket.io.min.js"
    ></script>

    <script src="inbox.js"></script>

</body>

</html>
