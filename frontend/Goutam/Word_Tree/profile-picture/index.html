<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile</title>

</head>


<body>

    <!-- =========================================
         PROFILE PICTURE POPUP
         ========================================= -->

    <div
        class="profile-popup-overlay"
        id="profilePopup"
    >

        <div class="profile-popup">


            <!-- CLOSE BUTTON -->

            <button
                class="profile-popup-close"
                id="closeProfilePopup"
                type="button"
            >
                ×
            </button>


            <!-- USER NAME -->

            <h2 id="profileUserName">
                USER_NAME
            </h2>


            <!-- PROFILE IMAGE -->

            <div class="profile-image-container">

                <img
                    src="../assets/profile-placeholder.png"
                    alt="Profile Picture"
                    id="profilePopupImage"
                >

            </div>


            <!-- UPLOAD BUTTON -->

            <button
                class="upload-button"
                id="uploadProfilePicture"
                type="button"
            >
                UPLOAD NEW PICTURE
            </button>

        </div>

    </div>

</body>

</html>
